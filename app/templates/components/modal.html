{% macro render_modal(id, title) %}
<div id="{{ id }}" class="fixed inset-0 z-50 hidden">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-50" onclick="closeModal('{{ id }}')"></div>
  <!-- Modal Panel -->
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md relative z-10">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">{{ title }}</h3>
        <button onclick="closeModal('{{ id }}')"
                class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="px-6 py-4">
        {{ caller() }}
      </div>
    </div>
  </div>
</div>
{% endmacro %}
