{% extends 'base.html' %}

{% block title %}Login – Lab Demo Manager{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-white shadow-lg rounded-2xl p-8 border border-gray-200">
      <!-- Logo / Icon -->
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 bg-indigo-600 rounded-xl flex items-center justify-center">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">Lab Demo Manager</h1>
      <p class="text-center text-sm text-gray-500 mb-6">Sign in to your account</p>

      <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autofocus
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
            placeholder="your-username"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
          Sign In
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-gray-400 mt-4">
      Only authorised lab participants can log in. Contact your admin for access.
    </p>
  </div>
</div>
{% endblock %}
